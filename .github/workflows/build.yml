name: Build Clip IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Unsigned IPA
        run: |
          # 1. Initialize git submodules
          git submodule update --init --recursive

          # 2. Build Clip target using workspace
          xcodebuild build \
            -workspace Clip.xcworkspace \
            -scheme Clip \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DERIVED_DATA_DIR=build

          # 3. Package build into Payload directory for IPA
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Clip.app Payload/
          zip -r Clip.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clip-IPA
          path: Clip.ipa
