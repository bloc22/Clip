name: Build Clip IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build Unsigned IPA
        run: |
          # 1. Force update and init all submodules
          git submodule update --init --recursive

          # 2. Build using the workspace file
          xcodebuild build \
            -workspace Clip.xcworkspace \
            -scheme Clip \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DERIVED_DATA_DIR=build

          # 3. Create Payload and package IPA
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Clip.app Payload/
          zip -r Clip.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clip-IPA
          path: Clip.ipa
